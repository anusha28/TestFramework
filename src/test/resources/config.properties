base.url=https://www.homedepot.com
search.term=hammer

# 0 so optional checks (cookie/store banners) do not silently wait 10s each.
# Required elements use explicit.wait instead.
implicit.wait=0

# Per-action timeout for visible/clickable/URL waits.
explicit.wait=20

# Hard cap for driver.get() / full page navigation. Selenium default is 300s.
page.load.timeout=30
script.timeout=30

# Whole-test cap in seconds. Also mirrored in testng.xml and @Test(timeOut).
test.timeout=180

# Save a PNG after each click/type under target/screenshots/. Leave false unless debugging a locator.
screenshot.on.action=false
